name: Оновлення даних

# Один запуск працює ~5,7 год і щохвилини оновлює сайт, потім сам запускає наступний.
# Розклад — лише запасний спосіб перезапуску, якщо ланцюжок обірветься.
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['inspect.mjs', '.github/workflows/inspect.yml']

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: scraper
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: https://slade444.github.io/misciavzali/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Доступ до сховища артефактів для публікації
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Збирати й публікувати щохвилини
        run: node loop.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EDIT_PIN: ${{ secrets.EDIT_PIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_DB_URL: >-
            https://misciavzali-default-rtdb.europe-west1.firebasedatabase.app
            https://misciavzali-default-rtdb.firebaseio.com
            https://misciavzali-default-rtdb.asia-southeast1.firebasedatabase.app
          RUN_MINUTES: '340'
      - name: Запустити наступний цикл
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/dispatches" -f ref=main
