name: Оновлення даних

# Один запуск працює ~5,7 год і щохвилини оновлює сайт, потім сам запускає наступний.
# Розклад — лише запасний спосіб перезапуску, якщо ланцюжок обірветься.
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: scraper
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: https://slade444.github.io/misciavzali/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Збирати й публікувати щохвилини
        run: node loop.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: '340'
      - name: Запустити наступний цикл
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/dispatches" -f ref=main
